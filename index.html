<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071116"><title>水景 — Tide Soundscape</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 15%,#173743 0,#09191f 35%,#03090c 100%);color:#eef7f7;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 15%,#7fd5dc10 50%,transparent 75%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(8%) translateY(3%)}}main{width:min(760px,100%);margin:auto;padding:48px 22px 38px}
header{text-align:center;margin:7vh 0 42px}.eyebrow{font-size:11px;letter-spacing:.34em;opacity:.55}.title{font-family:serif;font-weight:400;font-size:clamp(54px,15vw,92px);letter-spacing:.18em;margin:10px 0 6px;padding-left:.18em}.sub{font-size:12px;letter-spacing:.22em;opacity:.55}
.orb{width:min(70vw,360px);aspect-ratio:1;margin:0 auto 34px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 45% 35%,#8be0e733,#2b8d9b22 45%,#07111600 70%);box-shadow:0 0 100px #50cad225}
.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;border:1px solid #b9f5f522;inset:10%;animation:pulse 8s ease-in-out infinite}.orb:after{inset:22%;animation-delay:-4s}@keyframes pulse{50%{transform:scale(1.08);opacity:.3}}
.tide{text-align:center}.height{font:300 clamp(48px,13vw,74px)/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:-.06em}.unit{font-size:16px;opacity:.55;margin-left:6px}.state{margin-top:13px;font-size:13px;letter-spacing:.2em;opacity:.75}
.card{border:1px solid #d9ffff18;background:#ffffff08;backdrop-filter:blur(20px);border-radius:22px;padding:20px;margin:18px 0}.row{display:flex;justify-content:space-between;gap:20px;align-items:center}.label{font-size:12px;opacity:.55}.value{font-size:13px}.track{height:3px;background:#ffffff13;border-radius:99px;margin:16px 0 6px;overflow:hidden}.fill{height:100%;width:50%;background:#d8ffffaa;transition:width 2s ease}
button{width:100%;border:0;border-radius:18px;padding:18px 22px;font-size:15px;letter-spacing:.12em;background:#e8ffff;color:#061114;box-shadow:0 12px 45px #66dce733;cursor:pointer}button.playing{background:#ffffff10;color:#eff;border:1px solid #ffffff22}
.controls{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-top:15px}input[type=range]{width:100%;accent-color:#dff}.vol{font:12px ui-monospace,monospace;opacity:.65;width:42px;text-align:right}
.note{font-size:11px;line-height:1.8;opacity:.42;margin-top:18px;text-align:center}.status{font-size:11px;opacity:.45;text-align:center;margin:14px}.error{color:#ffd7c7}
footer{text-align:center;font-size:10px;line-height:1.8;opacity:.32;margin-top:45px}a{color:inherit}
</style>
</head>
<body><main>
<header><div class="eyebrow">GENERATIVE TIDE SOUNDSCAPE</div><h1 class="title">水景</h1><div class="sub">SUIKEI · TOKYO BAY</div></header>
<section class="orb"><div class="tide"><div><span id="height" class="height">--</span><span class="unit">m</span></div><div id="state" class="state">潮を読んでいます</div></div></section>
<div class="card">
 <div class="row"><span class="label">TIDE LEVEL</span><span id="range" class="value">--</span></div><div class="track"><div id="fill" class="fill"></div></div>
 <div class="row" style="margin-top:15px"><span class="label">MOTION</span><span id="motion" class="value">--</span></div>
</div>
<button id="play">音の景色をひらく</button>
<div class="controls card"><input id="volume" type="range" min="0" max="100" value="82"><span id="volText" class="vol">82%</span></div>
<div id="status" class="status">東京湾の潮位に同期します</div>
<p class="note">iPhone / iPad はブラウザの仕様上、最初の再生に1回のタップが必要です。<br>再生後はWeb Audioで連続生成します。</p>
<footer>潮位: Open-Meteo Marine API · 参考値（航海用途不可）<br>Sound generated in real time — no prerecorded music</footer>
</main>
<script>
const $=s=>document.querySelector(s);
const TIDE_URL='https://marine-api.open-meteo.com/v1/marine?latitude=35.62&longitude=139.77&hourly=sea_level_height_msl&timezone=Asia%2FTokyo&past_days=1&forecast_days=2&cell_selection=sea';
let tide={height:0,norm:.5,slope:0,min:0,max:1},ctx,master,compressor,running=false,timers=[];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a);
async function loadTide(){
 try{
  const r=await fetch(TIDE_URL,{cache:'no-store'}); if(!r.ok)throw Error('API '+r.status); const d=await r.json();
  const ts=d.hourly.time.map(x=>new Date(x).getTime()), vs=d.hourly.sea_level_height_msl; const now=Date.now();
  let i=ts.findIndex(t=>t>=now); if(i<1)i=Math.max(1,ts.length-1);
  const t=clamp((now-ts[i-1])/(ts[i]-ts[i-1])); const h=lerp(vs[i-1],vs[i],t);
  const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
  const day=vs.filter((_,j)=>d.hourly.time[j].startsWith(today)).filter(Number.isFinite);
  const mn=Math.min(...day),mx=Math.max(...day), slope=vs[i]-vs[i-1];
  tide={height:h,norm:clamp((h-mn)/Math.max(.01,mx-mn)),slope,min:mn,max:mx}; renderTide();
 }catch(e){$('#status').textContent='潮位データを取得できません — 穏やかな標準モードで再生します';$('#status').classList.add('error')}
}
function renderTide(){
 $('#height').textContent=tide.height.toFixed(2); $('#fill').style.width=(tide.norm*100).toFixed(0)+'%';
 $('#range').textContent=tide.min.toFixed(2)+' — '+tide.max.toFixed(2)+' m';
 const near=tide.norm>.88?'満潮へ':tide.norm<.12?'干潮へ':tide.slope>=0?'上げ潮':'下げ潮';
 $('#state').textContent=near; $('#motion').textContent=tide.slope>=0?'RISING / 上げ':'FALLING / 下げ';
}
function gain(v){const g=ctx.createGain();g.gain.value=v;return g}
function osc(type,f){const o=ctx.createOscillator();o.type=type;o.frequency.value=f;return o}
function pan(){return ctx.createStereoPanner()}
function makeVerb(sec=7,decay=3){const c=ctx.createConvolver(),len=ctx.sampleRate*sec,b=ctx.createBuffer(2,len,ctx.sampleRate);for(let ch=0;ch<2;ch++){let x=b.getChannelData(ch);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return c}
function envelope(g,t,a,d,peak){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function drone(){
 const bus=gain(.10),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=lerp(430,850,tide.norm);bus.connect(lp).connect(master);
 [55,82.41,110].forEach((f,k)=>{const o=osc(k===1?'triangle':'sine',f);const g=gain(k===0?.7:.28);o.detune.value=rand(-5,5);o.connect(g).connect(bus);o.start()});
 const lfo=osc('sine',rand(.018,.035)),lg=gain(.035);lfo.connect(lg).connect(bus.gain);lfo.start()
}
function pad(){
 if(!running)return; const t=ctx.currentTime+.05, roots=[110,146.83,164.81,220,246.94], f=roots[Math.floor(Math.random()*roots.length)];
 const g=gain(.0001),p=pan();p.pan.value=rand(-.65,.65);g.connect(p).connect(master);
 [1,1.5,2,3].forEach((m,k)=>{const o=osc(k<2?'sine':'triangle',f*m);o.detune.value=rand(-9,9);o.connect(g);o.start(t);o.stop(t+18)});
 envelope(g,t,4.5,11,lerp(.018,.05,tide.norm)); setTimeout(pad,rand(7000,15000)/lerp(.85,1.35,tide.norm))
}
const scale=[0,2,7,9,14,19];
function bell(){
 if(!running)return; const t=ctx.currentTime+.03,base=tide.norm>.7?329.63:220,semi=scale[Math.floor(Math.random()*scale.length)],f=base*Math.pow(2,semi/12);
 const g=gain(.0001),p=pan(),verb=makeVerb(rand(5,9),3.5),wet=gain(.7);p.pan.value=rand(-.8,.8);g.connect(p);p.connect(master);p.connect(verb).connect(wet).connect(master);
 [1,2.01,3.98].forEach((m,k)=>{const o=osc('sine',f*m);const og=gain(k?(.16/k):1);o.connect(og).connect(g);o.start(t);o.stop(t+9)});
 envelope(g,t,.018,rand(4.5,8),lerp(.035,.085,tide.norm));
 setTimeout(bell,rand(3500,11000)/lerp(.7,1.5,tide.norm))
}
function shimmer(){
 if(!running)return; if(Math.random()<lerp(.35,.8,tide.norm)){const t=ctx.currentTime+.02,g=gain(.0001),p=pan();p.pan.value=rand(-1,1);g.connect(p).connect(master);const f=rand(700,1250)*(tide.slope>=0?1.12:.94);const o=osc('sine',f);o.connect(g);o.start(t);o.stop(t+12);envelope(g,t,2.5,7,lerp(.008,.027,tide.norm))}
 setTimeout(shimmer,rand(9000,19000))
}
function water(){
 const n=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const src=ctx.createBufferSource();src.buffer=n;src.loop=true;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200;bp.Q.value=.7;const g=gain(.014);src.connect(bp).connect(g).connect(master);src.start();
 const l=osc('sine',.055),lg=gain(550);l.connect(lg).connect(bp.frequency);l.start()
}
async function start(){
 if(running){await ctx.suspend();running=false;$('#play').textContent='音の景色をひらく';$('#play').classList.remove('playing');return}
 if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'playback'});master=gain(.82);compressor=ctx.createDynamicsCompressor();compressor.threshold.value=-12;compressor.knee.value=12;compressor.ratio.value=5;compressor.attack.value=.01;compressor.release.value=.35;master.connect(compressor).connect(ctx.destination);drone();water()}
 await ctx.resume();running=true;setVolume();pad();bell();shimmer();$('#play').textContent='水景をとじる';$('#play').classList.add('playing')
}
function setVolume(){const v=+$('#volume').value;$('#volText').textContent=v+'%';if(master&&ctx)master.gain.setTargetAtTime(Math.pow(v/100,1.35),ctx.currentTime,.08)}
$('#play').addEventListener('click',start);$('#volume').addEventListener('input',setVolume);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running&&ctx?.state==='suspended')ctx.resume().catch(()=>{})});
loadTide();setInterval(loadTide,10*60*1000);
</script></body></html>
